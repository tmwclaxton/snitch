name: "Production Deploy"

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:
      - "README.md"
      - "AGENTS.md"
      - "GEMINI.md"
      - ".cursor/**"
      - ".agents/**"
      - ".ai/**"

# Overlapping main pushes previously pulled / transferred in parallel on the VPS
# and amplified TLS / Access SSH failures. Queue deploys instead of cancelling.
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/tmwclaxton/snitch:latest
  EDGE_IMAGE: nginx:1.27-alpine
  DEPLOY_HOST: admin.grantgunner.org
  DEPLOY_USER: snitch
  DEPLOY_DIR: /opt/snitch
  # 2026.6.0 regressed headless Access SSH service-token auth; pin a known-good release.
  CLOUDFLARED_VERSION: "2026.5.1"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: false
          sbom: false
          cache-from: type=registry,ref=ghcr.io/tmwclaxton/snitch:buildcache
          cache-to: type=registry,ref=ghcr.io/tmwclaxton/snitch:buildcache,mode=max
          tags: |
            ${{ env.IMAGE }}
            ghcr.io/tmwclaxton/snitch:sha-${{ github.sha }}

  deploy:
    name: Deploy to self-hosted server
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: read
    env:
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - name: Install cloudflared
        run: |
          curl -fsSL --output /tmp/cloudflared.deb \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64.deb"
          sudo dpkg -i /tmp/cloudflared.deb
          cloudflared --version

      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          CLOUDFLARED_BIN="$(command -v cloudflared)"
          # Absolute cloudflared path + IPv4 + ControlMaster: Access SSH flaps often show up as
          # "banner exchange" / "UNKNOWN port 65535" on every fresh ProxyCommand handshake.
          cat > ~/.ssh/config << EOF
          Host ${{ env.DEPLOY_HOST }}
            User ${{ env.DEPLOY_USER }}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking no
            AddressFamily inet
            ServerAliveInterval 15
            ServerAliveCountMax 120
            ConnectTimeout 45
            ConnectionAttempts 3
            ControlMaster auto
            ControlPath ~/.ssh/cm-%r@%h:%p
            ControlPersist 10m
            ProxyCommand ${CLOUDFLARED_BIN} access ssh --hostname %h --service-token-id ${CF_ACCESS_CLIENT_ID} --service-token-secret ${CF_ACCESS_CLIENT_SECRET}
          EOF

      - name: Open SSH master connection
        run: |
          set -euo pipefail
          # One successful Access handshake is reused by later scp/ssh steps.
          retry_with_backoff() {
            local max_attempts="$1"
            shift
            local attempt=1
            local delay=5

            while [ "$attempt" -le "$max_attempts" ]; do
              if "$@"; then
                return 0
              fi
              if [ "$attempt" -eq "$max_attempts" ]; then
                echo "Command failed after ${max_attempts} attempts: $*" >&2
                return 1
              fi
              echo "Attempt ${attempt}/${max_attempts} failed; retrying in ${delay}s..."
              sleep "$delay"
              delay=$((delay * 2))
              if [ "$delay" -gt 60 ]; then
                delay=60
              fi
              attempt=$((attempt + 1))
            done
          }

          open_master() {
            ssh -O check ${{ env.DEPLOY_HOST }} 2>/dev/null && return 0
            ssh -o ControlMaster=yes -o ControlPersist=10m -Nf ${{ env.DEPLOY_HOST }}
            ssh -O check ${{ env.DEPLOY_HOST }}
          }

          retry_with_backoff 8 open_master

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy deploy files to server
        run: |
          set -euo pipefail
          # Prefer the multiplexed master socket; one scp avoids a second handshake.
          retry_with_backoff() {
            local max_attempts="$1"
            shift
            local attempt=1
            local delay=5

            while [ "$attempt" -le "$max_attempts" ]; do
              if "$@"; then
                return 0
              fi
              if [ "$attempt" -eq "$max_attempts" ]; then
                echo "Command failed after ${max_attempts} attempts: $*" >&2
                return 1
              fi
              echo "Attempt ${attempt}/${max_attempts} failed; retrying in ${delay}s..."
              sleep "$delay"
              delay=$((delay * 2))
              if [ "$delay" -gt 60 ]; then
                delay=60
              fi
              attempt=$((attempt + 1))
            done
          }

          copy_deploy_files() {
            # Unlink targets before scp. Directory is snitch-writable, but a file
            # owned by another UID (e.g. leftover from a different deploy user)
            # cannot be overwritten and fails with "Permission denied".
            ssh ${{ env.DEPLOY_HOST }} "mkdir -p ${{ env.DEPLOY_DIR }}/docker/production/edge/conf.d ${{ env.DEPLOY_DIR }}/edge && rm -f \
              ${{ env.DEPLOY_DIR }}/compose.prod.yaml \
              ${{ env.DEPLOY_DIR }}/deploy-production.sh \
              ${{ env.DEPLOY_DIR }}/docker/production/edge/nginx.conf \
              ${{ env.DEPLOY_DIR }}/docker/production/edge/upstream-active.conf.default \
              ${{ env.DEPLOY_DIR }}/docker/production/edge/conf.d/snitch.conf"
            scp compose.prod.yaml scripts/deploy-production.sh \
              ${{ env.DEPLOY_HOST }}:${{ env.DEPLOY_DIR }}/
            scp docker/production/edge/nginx.conf \
              docker/production/edge/upstream-active.conf.default \
              ${{ env.DEPLOY_HOST }}:${{ env.DEPLOY_DIR }}/docker/production/edge/
            scp docker/production/edge/conf.d/snitch.conf \
              ${{ env.DEPLOY_HOST }}:${{ env.DEPLOY_DIR }}/docker/production/edge/conf.d/
          }

          retry_with_backoff 5 copy_deploy_files

      - name: Transfer image to server
        env:
          IMAGE_SHA: ghcr.io/tmwclaxton/snitch:sha-${{ github.sha }}
          IMAGE_LATEST: ghcr.io/tmwclaxton/snitch:latest
        run: |
          set -euo pipefail
          # Host → GHCR pulls keep dying on TLS handshake timeouts / hung blobs.
          # Pull on the Actions runner (reliable GHCR path), then stream the image
          # over SSH so the self-hosted host never needs registry egress for deploys.
          # Also preload edge nginx (compose uses --pull never); host may not have it yet.
          retry_with_backoff() {
            local max_attempts="$1"
            shift
            local attempt=1
            local delay=5

            while [ "$attempt" -le "$max_attempts" ]; do
              if "$@"; then
                return 0
              fi
              if [ "$attempt" -eq "$max_attempts" ]; then
                echo "Command failed after ${max_attempts} attempts: $*" >&2
                return 1
              fi
              echo "Attempt ${attempt}/${max_attempts} failed; retrying in ${delay}s..."
              sleep "$delay"
              delay=$((delay * 2))
              if [ "$delay" -gt 60 ]; then
                delay=60
              fi
              attempt=$((attempt + 1))
            done
          }

          retry_with_backoff 5 docker pull "$IMAGE_SHA"
          retry_with_backoff 5 docker pull "$EDGE_IMAGE"

          transfer_image() {
            # Expand IMAGE_* on the runner before SSH; single quotes would send literals.
            docker save "$IMAGE_SHA" "$EDGE_IMAGE" | gzip -1 | ssh ${{ env.DEPLOY_HOST }} "
              set -euo pipefail
              gunzip | docker load
              docker tag ${IMAGE_SHA} ${IMAGE_LATEST}
            "
          }

          retry_with_backoff 4 transfer_image

      - name: Deploy to server
        run: |
          set -euo pipefail
          # Outer retries cover SSH transport flaps. Image is already on the host.
          retry_with_backoff() {
            local max_attempts="$1"
            shift
            local attempt=1
            local delay=10

            while [ "$attempt" -le "$max_attempts" ]; do
              if "$@"; then
                return 0
              fi
              if [ "$attempt" -eq "$max_attempts" ]; then
                echo "Command failed after ${max_attempts} attempts: $*" >&2
                return 1
              fi
              echo "Attempt ${attempt}/${max_attempts} failed; retrying in ${delay}s..."
              sleep "$delay"
              delay=$((delay * 2))
              if [ "$delay" -gt 90 ]; then
                delay=90
              fi
              attempt=$((attempt + 1))
            done
          }

          retry_with_backoff 4 ssh ${{ env.DEPLOY_HOST }} "
            set -e
            cd ${{ env.DEPLOY_DIR }}
            chmod +x deploy-production.sh
            SKIP_GHCR_PULL=1 ./deploy-production.sh
          "

      - name: Confirm schedule and print snitch:audit
        continue-on-error: true
        run: |
          set -euo pipefail
          ssh ${{ env.DEPLOY_HOST }} bash -s <<'REMOTE'
          set -euo pipefail
          SLOT="$(cat /opt/snitch/.deploy-slot)"
          APP="snitch-app-${SLOT}"
          echo "LIVE_SLOT=${SLOT}"
          docker exec "$APP" php artisan schedule:list
          docker exec "$APP" php artisan snitch:audit --json || true
          REMOTE

      # One-shot ops hook: commit message containing [regen-brief-user-1] regenerates
      # today's brief for user 1 after deploy and prints the escape-room multiplier check.
      - name: Regenerate user 1 daily brief when tagged
        if: contains(github.event.head_commit.message, '[regen-brief-user-1]')
        run: |
          set -euo pipefail
          ssh ${{ env.DEPLOY_HOST }} bash -s <<'REMOTE'
          set -euo pipefail
          SLOT="$(cat /opt/snitch/.deploy-slot)"
          APP="snitch-app-${SLOT}"
          echo "LIVE_SLOT=${SLOT}"
          docker exec "$APP" php artisan snitch:generate-daily-briefs --user=1 --force --sync
          cat > /tmp/snitch-check-daily-brief.php <<'PHP'
          <?php

          use App\Models\DailyBrief;
          use App\Models\Post;
          use App\Services\Dashboard\DashboardMath;
          use Illuminate\Contracts\Console\Kernel;

          require __DIR__.'/vendor/autoload.php';
          $app = require __DIR__.'/bootstrap/app.php';
          $app->make(Kernel::class)->bootstrap();

          $brief = DailyBrief::query()
              ->where('user_id', 1)
              ->orderByDesc('brief_date')
              ->orderByDesc('id')
              ->first();

          if ($brief === null) {
              fwrite(STDERR, "no_brief\n");
              exit(1);
          }

          $facts = is_array($brief->facts) ? $brief->facts : [];
          $own = is_array($facts['own'] ?? null) ? $facts['own'] : [];
          $payload = is_array($brief->payload) ? $brief->payload : [];

          echo 'brief_id='.$brief->id."\n";
          echo 'brief_date='.($brief->brief_date?->toDateString() ?? '')."\n";
          echo 'status='.$brief->status."\n";
          echo 'own_handle='.($own['handle'] ?? '')."\n";

          $best30 = is_array($own['best_post_30d'] ?? null) ? $own['best_post_30d'] : null;
          echo 'best30='.json_encode($best30, JSON_UNESCAPED_SLASHES)."\n";
          $candidates = [];
          foreach (['best_post_30d', 'best_post_7d'] as $key) {
              if (is_array($own[$key] ?? null)) {
                  $candidates[] = $own[$key];
              }
          }
          foreach (['posts_last_7d', 'posts_last_24h', 'posts_yesterday', 'standout_winners'] as $key) {
              foreach ($own[$key] ?? [] as $row) {
                  if (is_array($row)) {
                      $candidates[] = $row;
                  }
              }
          }

          $escape = null;
          foreach ($candidates as $row) {
              $blob = strtolower((string) json_encode($row));
              if (str_contains($blob, 'escape')) {
                  $escape = $row;
                  break;
              }
          }

          $trackerId = (int) ($own['tracked_account_id'] ?? 0);
          $tracker = $trackerId > 0 ? App\Models\TrackedAccount::query()->find($trackerId) : null;
          $socialId = $tracker?->social_account_id;
          if ($escape === null && $socialId) {
              $post = Post::query()
                  ->where('social_account_id', $socialId)
                  ->where(function ($query): void {
                      $query->where('caption', 'ilike', '%escape%')
                          ->orWhere('caption', 'ilike', '%escape room%');
                  })
                  ->orderByDesc('posted_at')
                  ->first();
              if ($post) {
                  $history = Post::query()
                      ->where('social_account_id', $socialId)
                      ->whereNotNull('posted_at')
                      ->orderByDesc('posted_at')
                      ->get();
                  $pi = app(DashboardMath::class)->performanceIndex($post, $history);
                  $escape = [
                      'post_id' => (int) $post->id,
                      'likes' => app(DashboardMath::class)->likes($post),
                      'posted_at' => $post->posted_at?->toIso8601String(),
                      'caption' => mb_substr((string) $post->caption, 0, 120),
                      'times_usual' => $pi['pi'] !== null ? app(DashboardMath::class)->round1((float) $pi['pi']) : null,
                      'prior_n' => $pi['prior_n'] ?? null,
                      'source' => 'db_caption_lookup',
                  ];
              }
          }
          if ($escape === null) {
              $escape = $best30;
          }

          echo 'escape_or_best30='.json_encode($escape, JSON_UNESCAPED_SLASHES)."\n";
          echo 'escape_or_best30_times_usual='.json_encode($escape['times_usual'] ?? null)."\n";
          echo 'escape_or_best30_label='.($escape['times_usual_label'] ?? '')."\n";
          echo 'escape_or_best30_prior_n='.json_encode($escape['prior_n'] ?? null)."\n";
          echo 'escape_or_best30_likes='.json_encode($escape['likes'] ?? null)."\n";

          $postId = (int) ($escape['post_id'] ?? 0);
          if ($postId > 0) {
              $post = Post::query()->find($postId);
              $postSocialId = $post?->social_account_id;
              $history = $postSocialId
                  ? Post::query()->where('social_account_id', $postSocialId)->whereNotNull('posted_at')->orderByDesc('posted_at')->get()
                  : collect();
              $pi = $post ? app(DashboardMath::class)->performanceIndex($post, $history) : null;
              echo 'dashboard_pi='.json_encode($pi)."\n";
              if (is_array($pi) && isset($pi['pi']) && is_numeric($pi['pi']) && is_numeric($escape['times_usual'] ?? null)) {
                  $dash = round((float) $pi['pi'], 1);
                  $briefPi = round((float) $escape['times_usual'], 1);
                  echo 'dashboard_times_usual='.$dash."\n";
                  echo 'match_dashboard='.($dash === $briefPi ? 'yes' : 'no')."\n";
              }
          }

          foreach (['headline', 'own_summary', 'competitor_summary'] as $field) {
              $val = (string) ($payload[$field] ?? '');
              if ($val !== '' && str_contains(strtolower($val), 'usual')) {
                  echo $field.'='.$val."\n";
              }
          }
          PHP
          docker cp /tmp/snitch-check-daily-brief.php "$APP":/var/www/html/snitch-check-daily-brief.php
          docker exec "$APP" php /var/www/html/snitch-check-daily-brief.php
          docker exec "$APP" rm -f /var/www/html/snitch-check-daily-brief.php
          rm -f /tmp/snitch-check-daily-brief.php
          REMOTE

      - name: Close SSH master connection
        if: always()
        run: ssh -O exit ${{ env.DEPLOY_HOST }} || true
