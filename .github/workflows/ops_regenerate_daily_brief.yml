name: "Ops regenerate daily brief"

on:
  workflow_dispatch:
    inputs:
      user_id:
        description: "User id to regenerate"
        required: true
        default: "1"

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  DEPLOY_HOST: admin.grantgunner.org
  DEPLOY_USER: snitch
  CLOUDFLARED_VERSION: "2026.5.1"

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      USER_ID: ${{ inputs.user_id }}

    steps:
      - name: Install cloudflared
        run: |
          curl -fsSL --output /tmp/cloudflared.deb \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64.deb"
          sudo dpkg -i /tmp/cloudflared.deb
          cloudflared --version

      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          CLOUDFLARED_BIN="$(command -v cloudflared)"
          cat > ~/.ssh/config << EOF
          Host ${{ env.DEPLOY_HOST }}
            User ${{ env.DEPLOY_USER }}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking no
            AddressFamily inet
            ServerAliveInterval 15
            ServerAliveCountMax 120
            ConnectTimeout 45
            ConnectionAttempts 3
            ControlMaster auto
            ControlPath ~/.ssh/cm-%r@%h:%p
            ControlPersist 10m
            ProxyCommand ${CLOUDFLARED_BIN} access ssh --hostname %h --service-token-id ${CF_ACCESS_CLIENT_ID} --service-token-secret ${CF_ACCESS_CLIENT_SECRET}
          EOF

      - name: Open SSH master connection
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if ssh -o ControlMaster=yes -o ControlPersist=10m -Nf ${{ env.DEPLOY_HOST }}; then
              ssh -O check ${{ env.DEPLOY_HOST }}
              exit 0
            fi
            sleep $((attempt * 4))
          done
          exit 1

      - name: Regenerate daily brief and confirm escape-room multiplier
        run: |
          set -euo pipefail
          ssh ${{ env.DEPLOY_HOST }} "USER_ID=${USER_ID} bash -s" <<'REMOTE'
          set -euo pipefail
          SLOT="$(cat /opt/snitch/.deploy-slot)"
          APP="snitch-app-${SLOT}"
          echo "LIVE_SLOT=${SLOT}"
          docker exec "$APP" php artisan snitch:generate-daily-briefs --user="$USER_ID" --force --sync

          cat > /tmp/snitch-check-daily-brief.php <<'PHP'
          <?php

          use App\Models\DailyBrief;
          use App\Models\Post;
          use App\Services\Dashboard\DashboardMath;
          use Illuminate\Contracts\Console\Kernel;

          require __DIR__.'/vendor/autoload.php';
          $app = require __DIR__.'/bootstrap/app.php';
          $app->make(Kernel::class)->bootstrap();

          $userId = (int) getenv('USER_ID');
          $brief = DailyBrief::query()
              ->where('user_id', $userId)
              ->orderByDesc('brief_date')
              ->orderByDesc('id')
              ->first();

          if ($brief === null) {
              fwrite(STDERR, "no_brief\n");
              exit(1);
          }

          $facts = is_array($brief->facts) ? $brief->facts : [];
          $own = is_array($facts['own'] ?? null) ? $facts['own'] : [];
          $payload = is_array($brief->payload) ? $brief->payload : [];

          echo 'brief_id='.$brief->id."\n";
          echo 'brief_date='.($brief->brief_date?->toDateString() ?? '')."\n";
          echo 'status='.$brief->status."\n";
          echo 'own_handle='.($own['handle'] ?? '')."\n";

          $best30 = is_array($own['best_post_30d'] ?? null) ? $own['best_post_30d'] : null;
          echo 'best30='.json_encode($best30, JSON_UNESCAPED_SLASHES)."\n";

          $candidates = [];
          foreach (['best_post_30d', 'best_post_7d'] as $key) {
              if (is_array($own[$key] ?? null)) {
                  $candidates[] = $own[$key];
              }
          }
          foreach (['posts_last_7d', 'posts_last_24h', 'posts_yesterday', 'standout_winners'] as $key) {
              foreach ($own[$key] ?? [] as $row) {
                  if (is_array($row)) {
                      $candidates[] = $row;
                  }
              }
          }

          $escape = null;
          foreach ($candidates as $row) {
              $blob = strtolower((string) json_encode($row));
              if (str_contains($blob, 'escape')) {
                  $escape = $row;
                  break;
              }
          }
          if ($escape === null) {
              $escape = $best30;
          }

          echo 'escape_or_best30_times_usual='.json_encode($escape['times_usual'] ?? null)."\n";
          echo 'escape_or_best30_label='.($escape['times_usual_label'] ?? '')."\n";
          echo 'escape_or_best30_prior_n='.json_encode($escape['prior_n'] ?? null)."\n";
          echo 'escape_or_best30_likes='.json_encode($escape['likes'] ?? null)."\n";
          echo 'escape_or_best30_posted='.($escape['posted_label'] ?? '')."\n";
          echo 'escape_or_best30_hook='.($escape['hook'] ?? $escape['caption'] ?? '')."\n";

          $postId = (int) ($escape['post_id'] ?? 0);
          if ($postId > 0) {
              $post = Post::query()->find($postId);
              $socialId = $post?->social_account_id;
              $history = $socialId
                  ? Post::query()->where('social_account_id', $socialId)->whereNotNull('posted_at')->orderByDesc('posted_at')->get()
                  : collect();
              $pi = $post ? app(DashboardMath::class)->performanceIndex($post, $history) : null;
              echo 'dashboard_pi='.json_encode($pi)."\n";
              if (is_array($pi) && isset($pi['pi']) && is_numeric($pi['pi']) && is_numeric($escape['times_usual'] ?? null)) {
                  $dash = round((float) $pi['pi'], 1);
                  $briefPi = round((float) $escape['times_usual'], 1);
                  echo 'dashboard_times_usual='.$dash."\n";
                  echo 'match_dashboard='.($dash === $briefPi ? 'yes' : 'no')."\n";
              }
          }

          foreach (['headline', 'own_summary', 'competitor_summary'] as $field) {
              $val = (string) ($payload[$field] ?? '');
              if ($val !== '' && str_contains(strtolower($val), 'usual')) {
                  echo $field.'='.$val."\n";
              }
          }
          foreach ($payload['actions'] ?? [] as $i => $action) {
              if (! is_array($action)) {
                  continue;
              }
              foreach (['title', 'why', 'how'] as $field) {
                  $val = (string) ($action[$field] ?? '');
                  if ($val !== '' && str_contains(strtolower($val), 'usual')) {
                      echo "action{$i}.{$field}=".$val."\n";
                  }
              }
          }
          PHP

          docker cp /tmp/snitch-check-daily-brief.php "$APP":/var/www/html/snitch-check-daily-brief.php
          docker exec -e USER_ID="$USER_ID" "$APP" php /var/www/html/snitch-check-daily-brief.php
          docker exec "$APP" rm -f /var/www/html/snitch-check-daily-brief.php
          rm -f /tmp/snitch-check-daily-brief.php
          REMOTE

      - name: Close SSH master connection
        if: always()
        run: ssh -O exit ${{ env.DEPLOY_HOST }} || true
